
management:
  endpoint:
    health:
      show-details: always

server:
  port: 8087
spring:
  application:
    name: covoiturage-api
  datasource:
    url: jdbc:postgresql://localhost:5435/covoiturage_db
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

