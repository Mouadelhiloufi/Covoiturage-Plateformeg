services:
  postgres-covoiturage:
    image: postgres:16-alpine
    container_name: covoiturage-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: covoiturage_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - covoiturage_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d covoiturage_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  covoiturage_pgdata: